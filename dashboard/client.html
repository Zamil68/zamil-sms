<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06080F">
<title>Zamil SMS — Client Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#06080F;color:#E8ECF4;min-height:100vh}
.header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(6,8,15,.92);backdrop-filter:blur(10px);z-index:50;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:17px;font-weight:700;color:#4F8CFF}.logo span{color:#8B5CF6}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-user{font-size:12px;color:#8A93A6;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#E8ECF4;font-size:16px;cursor:pointer}
.rbtn.spin .r-ic{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.container{max-width:560px;margin:0 auto;padding:68px 14px 90px}
.login-card{background:#0D1220;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:30px 22px;margin-top:30px;text-align:center}
.login-logo{font-size:52px;margin-bottom:8px}
.login-title{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:#8A93A6;margin-bottom:22px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:11px;color:#8A93A6;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#131A2C;color:#E8ECF4;font-size:15px;outline:none}
.field input:focus{border-color:#4F8CFF}
.cap-row{display:flex;align-items:center;gap:10px}
.cap-q{flex:1;font-size:14px;color:#FFC46B;font-weight:600}
.cap-row input{flex:0 0 90px}
.btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#4F8CFF,#8B5CF6);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.err{color:#FF6B6B;font-size:12px;margin-top:12px;min-height:16px}
.hero{background:linear-gradient(135deg,#12203C,#1B1433);border:1px solid rgba(79,140,255,.25);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero-ic{font-size:34px}.hero-num{font-size:30px;font-weight:700;color:#4F8CFF}
.hero-label{font-size:11px;color:#8A93A6;text-transform:uppercase;letter-spacing:.5px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ED573;margin-right:5px;animation:pul 1.5s infinite}@keyframes pul{50%{opacity:.3}}
.hero-sub{font-size:11px;color:#8A93A6;margin-top:3px}
.card{background:#0D1220;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700}
.badge{background:rgba(79,140,255,.15);color:#4F8CFF;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
select.sel{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#131A2C;color:#E8ECF4;font-size:14px;margin-bottom:10px}
.num-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;background:#131A2C;margin-bottom:7px;cursor:pointer}
.num-item:active{transform:scale(.98)}
.num-val{font-size:15px;font-weight:600;letter-spacing:.3px}
.num-sub{font-size:11px;color:#8A93A6;margin-top:2px}
.copy-ic{color:#4F8CFF;font-size:16px}
.otp-item{background:#131A2C;border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid #2ED573}
.otp-item.new{animation:flash 1.2s ease}@keyframes flash{0%{background:#1E4034}100%{background:#131A2C}}
.otp-top{display:flex;justify-content:space-between;font-size:11px;color:#8A93A6;margin-bottom:6px}
.otp-cli{color:#FFC46B;font-weight:700}
.otp-code{display:inline-block;background:rgba(46,213,115,.15);color:#2ED573;font-weight:700;font-size:17px;letter-spacing:2px;padding:4px 12px;border-radius:8px;margin:4px 0;cursor:pointer}
.otp-num{font-size:12px;color:#8A93A6;margin-top:4px}
.otp-msg{font-size:12px;color:#B9C2D4;margin-top:5px;line-height:1.45;word-break:break-word}
.empty{text-align:center;color:#8A93A6;font-size:13px;padding:30px 0}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,13,22,.95);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);z-index:50}
.bn{flex:1;padding:11px 0 13px;text-align:center;color:#8A93A6;font-size:11px;font-weight:600;background:none;border:none;cursor:pointer}
.bn .ic{display:block;font-size:19px;margin-bottom:3px}
.bn.on{color:#4F8CFF}
#otpFloat{position:fixed;top:66px;left:0;right:0;display:flex;justify-content:center;z-index:99;pointer-events:none}
.float-card{pointer-events:auto;background:#0F2A1E;border:1px solid rgba(46,213,115,.4);border-radius:14px;padding:12px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(-16px);transition:.3s}
#otpFloat.show .float-card{opacity:1;transform:translateY(0)}
.float-code{font-size:22px;font-weight:700;color:#2ED573;letter-spacing:2px}
.float-cli{font-size:11px;color:#B9C2D4;margin-bottom:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="header">
  <div class="logo">Zamil <span>SMS</span></div>
  <div class="hdr-right">
    <span class="hdr-user" id="hdrUser"></span>
    <button class="rbtn" id="refreshBtn" onclick="manualRefresh()" title="Refresh"><span class="r-ic">↻</span></button>
  </div>
</header>
<div class="container">
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <div class="login-title">Client Portal</div>
      <div class="login-sub">Sign in with your LaMix panel account</div>
      <div class="field"><label>Username</label><input id="inpUser" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="inpPass" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Security check</label>
        <div class="cap-row"><span class="cap-q" id="capQ">Loading…</span><input id="inpCap" inputmode="numeric"></div>
      </div>
      <button class="btn-primary" id="btnLogin" onclick="doLogin()">Sign In</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
  <div id="appScreen" hidden>
    <div class="hero">
      <div class="hero-ic">📬</div>
      <div>
        <div class="hero-label">Today's OTPs</div>
        <div class="hero-num" id="todayCount">0</div>
        <div class="hero-sub"><span class="live-dot"></span>Live · auto-refresh 10s</div>
      </div>
    </div>
    <div id="tabNumbers">
      <div class="card">
        <div class="card-hdr"><div class="card-title">📡 My Ranges</div><span class="badge" id="rangeCount">0</span></div>
        <select class="sel" id="rangeSel" onchange="renderNumbers()"></select>
        <div class="card-hdr"><div class="card-title">📞 Numbers</div><span class="badge" id="numCount">0</span></div>
        <div id="numList"><div class="empty">Loading numbers…</div></div>
      </div>
    </div>
    <div id="tabOtp" hidden>
      <div class="card">
        <div class="card-hdr"><div class="card-title">📨 Live OTP Feed</div><span class="badge" id="otpCount">0</span></div>
        <div id="otpList"><div class="empty">Waiting for SMS…</div></div>
      </div>
    </div>
  </div>
</div>
<nav class="bnav" id="bnav" hidden>
  <button class="bn on" id="bnNum" onclick="switchTab('numbers')"><span class="ic">🔢</span>My Numbers</button>
  <button class="bn" id="bnOtp" onclick="switchTab('otp')"><span class="ic">📨</span>Live OTP</button>
</nav>
<div id="otpFloat"><div class="float-card"><div class="float-cli" id="fCli"></div><div class="float-code" id="fCode"></div></div></div>
<script>
var LM = { sess: localStorage.getItem('zlm_sess')||'', user: localStorage.getItem('zlm_user')||'', cookie: '' };
var ALL = [], OTPS = [], seen = {}, curTab = 'numbers';
function api(u,b){ return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function codeOf(m){ var x=String(m||'').match(/\b(\d{4,8})\b/); return x?x[1]:''; }

/* ── LOGIN ── */
function loadCaptcha(){ api('/api/lm/captcha',{}).then(function(d){ LM.cookie=d.cookie||''; document.getElementById('capQ').textContent=d.question||'What is 1 + 1 = ?'; }); }
function doLogin(){
  var u=document.getElementById('inpUser').value.trim(), p=document.getElementById('inpPass').value, a=document.getElementById('inpCap').value.trim();
  var err=document.getElementById('loginErr'); err.textContent='';
  document.getElementById('btnLogin').textContent='Signing in…';
  api('/api/lm/login',{username:u,password:p,answer:a,cookie:LM.cookie}).then(function(d){
    document.getElementById('btnLogin').textContent='Sign In';
    if(d&&d.ok){ LM.sess=d.lmSession; LM.user=d.username; localStorage.setItem('zlm_sess',LM.sess); localStorage.setItem('zlm_user',LM.user); enterApp(); }
    else{ err.textContent=(d&&d.error)||'Login failed'; loadCaptcha(); }
  }).catch(function(){ document.getElementById('btnLogin').textContent='Sign In'; err.textContent='Connection error'; });
}
function enterApp(){
  document.getElementById('loginScreen').hidden=true;
  document.getElementById('appScreen').hidden=false;
  document.getElementById('bnav').hidden=false;
  document.getElementById('hdrUser').textContent=LM.user;
  loadNumbers(); loadOtp(true);
}
function expired(){ localStorage.removeItem('zlm_sess'); localStorage.removeItem('zlm_user'); location.reload(); }

/* ── NUMBERS ── */
function loadNumbers(){
  api('/api/lm/numbers',{lmSession:LM.sess}).then(function(d){
    if(d&&d.sessionExpired) return expired();
    if(d&&d.throttled) return setTimeout(loadNumbers,1200);
    if(!d||!d.ok) return;
    ALL=d.numbers||[];
    var sel=document.getElementById('rangeSel'), cur=sel.value;
    sel.innerHTML='<option value="">All Ranges ('+ALL.length+')</option>'+(d.ranges||[]).map(function(r){return '<option value="'+esc(r.range)+'">'+esc(r.prefix)+' — '+esc(r.range)+' ('+r.count+')</option>';}).join('');
    if(cur) sel.value=cur;
    document.getElementById('rangeCount').textContent=(d.ranges||[]).length;
    renderNumbers();
  });
}
function renderNumbers(){
  var sel=document.getElementById('rangeSel').value;
  var list=sel?ALL.filter(function(n){return n.range===sel;}):ALL;
  document.getElementById('numCount').textContent=list.length;
  var el=document.getElementById('numList');
  if(!list.length){ el.innerHTML='<div class="empty">No numbers found</div>'; return; }
  el.innerHTML=list.map(function(n){
    return '<div class="num-item" onclick="copyText(\''+n.number+'\')"><div><div class="num-val">'+esc(n.number)+'</div><div class="num-sub">'+esc(n.range)+' · +'+esc(n.prefix)+' · '+esc(n.payterm)+' · '+esc(n.payout)+'</div></div><span class="copy-ic">⎘</span></div>';
  }).join('');
}

/* ── LIVE OTP (CDR) ── */
function loadOtp(first){
  api('/api/lm/cdr',{lmSession:LM.sess}).then(function(d){
    if(d&&d.sessionExpired) return expired();
    if(d&&d.throttled) return setTimeout(function(){loadOtp(first);},1200);
    if(!d||!d.ok) return;
    document.getElementById('todayCount').textContent=d.total||0;
    document.getElementById('otpCount').textContent=d.total||0;
    var fresh=[];
    (d.rows||[]).forEach(function(r){ var k=r.dt+'|'+r.number+'|'+r.message; if(!seen[k]){ seen[k]=1; fresh.push(r); } });
    if(fresh.length){
      OTPS=fresh.concat(OTPS).slice(0,200);
      renderOtp();
      if(!first){ var f=fresh[0]; showToast(f); chime(); }
    } else if(first){ OTPS=(d.rows||[]).slice(0,200); renderOtp(); }
  });
}
function renderOtp(){
  var el=document.getElementById('otpList');
  if(!OTPS.length){ el.innerHTML='<div class="empty">No SMS today yet — waiting…</div>'; return; }
  el.innerHTML=OTPS.map(function(r,i){ var c=codeOf(r.message);
    return '<div class="otp-item'+(i===0?' new':'')+'"><div class="otp-top"><span class="otp-cli">📨 '+esc(r.cli)+'</span><span>'+esc(r.dt.slice(11,19))+'</span></div>'+(c?'<div class="otp-code" onclick="copyText(\''+c+'\')">'+esc(c)+'</div>':'')+'<div class="otp-num">📱 '+esc(r.number)+' · '+esc(r.range)+'</div><div class="otp-msg">'+esc(r.message)+'</div></div>';
  }).join('');
}

/* ── UI helpers ── */
function switchTab(t){ curTab=t;
  document.getElementById('tabNumbers').hidden=(t!=='numbers');
  document.getElementById('tabOtp').hidden=(t!=='otp');
  document.getElementById('bnNum').classList.toggle('on',t==='numbers');
  document.getElementById('bnOtp').classList.toggle('on',t==='otp');
  if(t==='numbers') loadNumbers(); else loadOtp(false);
}
function manualRefresh(){ document.getElementById('refreshBtn').classList.add('spin');
  var p1=loadNumbers(), p2=loadOtp(false);
  setTimeout(function(){ document.getElementById('refreshBtn').classList.remove('spin'); },2500);
}
function copyText(t){ if(navigator.clipboard) navigator.clipboard.writeText(t); toastMsg('Copied '+t); }
var _ft; function showToast(r){ var c=codeOf(r.message); document.getElementById('fCli').textContent='📨 '+r.cli+' · '+r.number; document.getElementById('fCode').textContent=c||'New SMS'; var f=document.getElementById('otpFloat'); f.classList.add('show'); clearTimeout(_ft); _ft=setTimeout(function(){f.classList.remove('show');},4000); }
function toastMsg(t){ document.getElementById('fCli').textContent=t; document.getElementById('fCode').textContent='✓'; var f=document.getElementById('otpFloat'); f.classList.add('show'); clearTimeout(_ft); _ft=setTimeout(function(){f.classList.remove('show');},1500); }
var actx; function chime(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.connect(g); g.connect(actx.destination); o.frequency.value=880; g.gain.value=.15; o.start(); o.stop(actx.currentTime+.25);}catch(e){} }
setInterval(function(){ if(LM.sess && !document.hidden) loadOtp(false); },10000);
if(LM.sess) enterApp(); else loadCaptcha();
</script>
</body>
</html>
