<!-- cli-track.html — injected by cli-track.js (super admin only) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
#cliTrackPage{--tg:#34d399;--tgold:#fbbf24;--tmag:#f472b6;--tblu:#60a5fa;--tr:#f87171;
  --tcard:var(--card,#14161d);--tsurf:var(--surface,#1b1e27);--tbrd:var(--border,#262a35);--ttx:var(--text,#e8ecf4);--tmut:var(--muted,#9aa3b2);
  font-family:'Inter',system-ui,sans-serif;position:fixed;inset:0;z-index:600;overflow-y:auto;
  background:radial-gradient(900px 420px at 12% -8%,color-mix(in srgb,var(--tblu) 14%,transparent),transparent 68%),
             radial-gradient(760px 360px at 100% 0%,color-mix(in srgb,var(--tmag) 10%,transparent),transparent 70%),var(--bg,#0b0d12);
  background-attachment:fixed}
#cliTrackPage::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.4px);background-size:24px 24px;opacity:.5}
[data-theme="light"] #cliTrackPage::before{background-image:radial-gradient(rgba(15,23,42,.05) 1px,transparent 1.4px)}
#cliTrackPage>*{position:relative;z-index:1}
.ct-wrap{max-width:680px;margin:0 auto;padding:0 16px 96px}
.ct-display{font-family:'Space Grotesk',ui-monospace,monospace;letter-spacing:-.02em}
/* head */
.ct-head{display:flex;align-items:center;gap:11px;padding:16px 2px 8px}
.ct-back{width:38px;height:38px;flex-shrink:0;border-radius:12px;border:1px solid var(--tbrd);background:var(--tsurf);color:var(--ttx);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .15s}
.ct-back:active{transform:scale(.9)} .ct-back:hover{border-color:var(--tblu)}
.ct-back svg{width:18px;height:18px}
.ct-head h1{font-family:'Space Grotesk',sans-serif;font-size:1.22rem;font-weight:700;margin:0;letter-spacing:-.02em;flex:1;min-width:0}
.ct-head .ct-sub{display:block;font-family:'Inter';font-size:.62rem;font-weight:600;color:var(--tmut);letter-spacing:.04em;margin-top:1px}
.ct-live{display:inline-flex;align-items:center;gap:5px;font-size:.58rem;font-weight:700;color:var(--tg);letter-spacing:.07em;text-transform:uppercase}
.ct-live i{width:6px;height:6px;border-radius:50%;background:var(--tg);animation:ctPulse 1.8s infinite}
@keyframes ctPulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
/* segmented range */
.ct-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--tsurf);border:1px solid var(--tbrd);margin:6px 0 14px}
.ct-seg button{flex:1;border:0;background:transparent;color:var(--tmut);font:inherit;font-size:.74rem;font-weight:700;padding:9px 6px;border-radius:10px;cursor:pointer;transition:all .18s}
.ct-seg button.on{color:#06080f;background:linear-gradient(135deg,var(--tblu),#3b82f6);box-shadow:0 4px 14px -6px color-mix(in srgb,var(--tblu) 60%,transparent)}
/* stat grid */
.ct-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ct-stat{position:relative;overflow:hidden;border-radius:18px;padding:15px 15px 14px;background:var(--tcard);border:1px solid var(--tbrd);transition:transform .14s,box-shadow .14s}
.ct-stat:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(0,0,0,.5)}
.ct-stat::after{content:'';position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;opacity:.5;filter:blur(4px);background:radial-gradient(circle,var(--c,var(--tblu)),transparent 68%)}
.ct-stat .ic{position:relative;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c,var(--tblu)) 16%,var(--tsurf));border:1px solid color-mix(in srgb,var(--c,var(--tblu)) 26%,var(--tbrd));margin-bottom:9px}
.ct-stat .ic svg{width:15px;height:15px;color:var(--c,var(--tblu))}
.ct-stat .v{position:relative;font-family:'Space Grotesk',monospace;font-size:1.7rem;font-weight:700;line-height:1;color:var(--ttx)}
.ct-stat .k{position:relative;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tmut);margin-top:5px}
/* section head */
.ct-sec{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:var(--ttx)}
.ct-sec .pill{margin-left:auto;font-size:.6rem;font-weight:700;color:var(--tmut);background:var(--tsurf);border:1px solid var(--tbrd);border-radius:20px;padding:3px 10px}
/* filter chips */
.ct-filters{display:flex;gap:6px;margin-left:auto}
.ct-filters button{border:1px solid var(--tbrd);background:var(--tsurf);color:var(--tmut);font:inherit;font-size:.62rem;font-weight:700;padding:4px 11px;border-radius:20px;cursor:pointer;transition:all .15s}
.ct-filters button.on{color:var(--ttx);border-color:color-mix(in srgb,var(--tmag) 45%,var(--tbrd));background:color-mix(in srgb,var(--tmag) 12%,var(--tsurf))}
/* leaderboard rows */
.ct-list{display:flex;flex-direction:column;gap:9px}
.ct-row{position:relative;background:var(--tcard);border:1px solid var(--tbrd);border-radius:16px;padding:13px 14px;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .14s}
.ct-row:hover{border-color:color-mix(in srgb,var(--tblu) 38%,var(--tbrd));box-shadow:0 12px 30px -18px rgba(0,0,0,.5);transform:translateX(2px)}
.ct-row-top{display:flex;align-items:center;gap:11px}
.ct-rank{font-family:'Space Grotesk',monospace;font-size:.74rem;font-weight:700;color:var(--tmut);width:30px;text-align:center;flex-shrink:0}
.ct-row:nth-child(1) .ct-rank{color:#06080f;background:linear-gradient(135deg,var(--tgold),#f59e0b);border-radius:8px;padding:3px 0}
.ct-row:nth-child(2) .ct-rank{color:#06080f;background:linear-gradient(135deg,#cbd5e1,#94a3b8);border-radius:8px;padding:3px 0}
.ct-row:nth-child(3) .ct-rank{color:#fff;background:linear-gradient(135deg,#d97706,#b45309);border-radius:8px;padding:3px 0}
.ct-av{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',monospace;font-weight:700;font-size:.78rem;color:#06080f;background:hsl(var(--h,200),72%,62%)}
.ct-id{flex:1;min-width:0}
.ct-name{font-size:.86rem;font-weight:700;color:var(--ttx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ct-tag{font-size:.52rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.ct-tag.red{color:var(--tr);background:color-mix(in srgb,var(--tr) 14%,var(--tsurf));border:1px solid color-mix(in srgb,var(--tr) 30%,var(--tbrd))}
.ct-tag.mut{color:var(--tmut);background:var(--tsurf);border:1px solid var(--tbrd)}
.ct-seen{font-size:.62rem;color:var(--tmut);margin-top:3px}
.ct-total{text-align:right;flex-shrink:0}
.ct-total-num{font-family:'Space Grotesk',monospace;font-size:1.3rem;font-weight:700;color:var(--tg);line-height:1}
.ct-total-lbl{font-size:.52rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tmut)}
/* activity bar */
.ct-bar{height:5px;border-radius:4px;background:var(--tsurf);overflow:hidden;margin:11px 0 9px}
.ct-bar>i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--tblu),var(--tmag));transition:width .9s cubic-bezier(.2,.8,.2,1)}
/* breakdown chips */
.ct-chips{display:flex;flex-wrap:wrap;gap:6px}
.ct-chip{display:inline-flex;align-items:center;gap:5px;font-size:.64rem;font-weight:600;color:var(--tmut);background:var(--tsurf);border:1px solid var(--tbrd);border-radius:9px;padding:4px 9px}
.ct-chip svg{width:12px;height:12px}
.ct-chip b{font-family:'Space Grotesk',monospace;font-weight:700;color:var(--ttx)}
.ct-chip.i svg{color:var(--tblu)} .ct-chip.s svg{color:var(--tmag)} .ct-chip.q svg{color:var(--tgold)}
/* access toggles */
.ct-access{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed var(--tbrd)}
.ct-access-lbl{font-size:.56rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tmut);margin-right:2px}
.ct-tog{border:0;font:inherit;font-size:.64rem;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.ct-tog::before{content:'';width:7px;height:7px;border-radius:50%}
.ct-tog.on{color:var(--tg);background:color-mix(in srgb,var(--tg) 14%,var(--tsurf));border:1px solid color-mix(in srgb,var(--tg) 32%,var(--tbrd))}
.ct-tog.on::before{background:var(--tg)}
.ct-tog.off{color:var(--tr);background:color-mix(in srgb,var(--tr) 13%,var(--tsurf));border:1px solid color-mix(in srgb,var(--tr) 32%,var(--tbrd))}
.ct-tog.off::before{background:var(--tr)}
.ct-tog:active{transform:scale(.95)}
.ct-note{margin-top:9px}
.ct-note-inp{width:100%;box-sizing:border-box;padding:8px 11px;border-radius:9px;border:1px solid var(--tbrd);background:var(--tsurf);color:var(--ttx);font:inherit;font-size:.72rem;outline:none}
.ct-note-inp:focus{border-color:var(--tmag)}
/* top queries cloud */
.ct-cloud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--tcard);border:1px solid var(--tbrd);border-radius:16px;padding:16px}
.ct-qchip{display:inline-flex;align-items:baseline;gap:6px;line-height:1.25;color:var(--ttx);font-weight:600;transition:transform .14s}
.ct-qchip:hover{transform:scale(1.06)}
.ct-qchip-q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ct-qchip-n{font-family:'Space Grotesk',monospace;font-size:.62rem;font-weight:700;color:var(--tgold);background:color-mix(in srgb,var(--tgold) 14%,var(--tsurf));border-radius:20px;padding:1px 7px}
.ct-empty{text-align:center;padding:26px 16px;color:var(--tmut);font-size:.82rem}
/* skeleton */
.ct-sk{height:12px;border-radius:7px;background:linear-gradient(90deg,var(--tsurf) 25%,color-mix(in srgb,var(--tbrd) 60%,var(--tsurf)) 50%,var(--tsurf) 75%);background-size:200% 100%;animation:ctShim 1.3s infinite}
@keyframes ctShim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ct-sk-row{background:var(--tcard);border:1px solid var(--tbrd);border-radius:16px;padding:15px;margin-bottom:9px}
.ct-foot{text-align:center;font-size:.62rem;color:var(--tmut);margin-top:18px}
.ct-foot b{color:var(--ttx);font-family:'Space Grotesk',monospace}
/* reveal */
.ct-rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.ct-rv.in{opacity:1;transform:none}
@media(max-width:420px){.ct-stat .v{font-size:1.45rem}.ct-chip{font-size:.6rem}}
</style>

<div id="cliTrackPage" style="display:none">
<div class="ct-wrap">

  <div class="ct-head">
    <button class="ct-back" onclick="closeTrackPage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h1>CLI Track<span class="ct-sub">Insights &amp; Search usage · super admin</span></h1>

  <div class="ct-seg" id="ctSeg">
    <button data-r="day" class="on" onclick="setTrackRange('day')">Today</button>
    <button data-r="week" onclick="setTrackRange('week')">7 Days</button>
    <button data-r="month" onclick="setTrackRange('month')">30 Days</button>
  </div>

  <div class="ct-stats ct-rv">
    <div class="ct-stat" style="--c:var(--tblu)"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div><div class="v ct-display" id="ctStatUsers">0</div><div class="k">Active users</div></div>
    <div class="ct-stat" style="--c:var(--tg)"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div><div class="v ct-display" id="ctStatIns">0</div><div class="k">Insights opens</div></div>
    <div class="ct-stat" style="--c:var(--tmag)"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></div><div class="v ct-display" id="ctStatSrch">0</div><div class="k">Search page opens</div></div>
    <div class="ct-stat" style="--c:var(--tgold)"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div><div class="v ct-display" id="ctStatQ">0</div><div class="k">Searches run</div></div>
  </div>

  <div class="ct-sec ct-rv">Most active users
    <div class="ct-filters" id="ctFilters">
      <button data-f="all" class="on" onclick="setTrackFilter('all')">All</button>
      <button data-f="restricted" onclick="setTrackFilter('restricted')">Restricted</button>
    </div>
  </div>
  <div class="ct-list" id="ctList"></div>

  <div class="ct-sec ct-rv">Top searches<span class="pill" id="ctQCount">0</span></div>
  <div class="ct-cloud ct-rv" id="ctTopQ"></div>

  <div class="ct-foot">Window: <b id="ctWinLabel">—</b> · <span id="ctUpdated">updated just now</span></div>

</div>
</div>
