<!-- cli-search.html — card-based CLI Search UI -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
#cliSearchPage{--cs:#60a5fa;--csg:#34d399;--csgold:#fbbf24;--csmag:#f472b6;--csred:#f87171;
  font-family:'Inter',system-ui,sans-serif;position:fixed;inset:0;z-index:600;overflow-y:auto;
  background:radial-gradient(900px 400px at 50% -8%,color-mix(in srgb,var(--cs) 12%,transparent),transparent 70%),var(--bg,#0b0d12);
  background-attachment:fixed}
#cliSearchPage::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.4px);background-size:24px 24px;opacity:.5}
#cliSearchPage>*{position:relative;z-index:1}
.cs-wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
/* header */
.cs-head{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
.cs-back{width:38px;height:38px;flex-shrink:0;border-radius:12px;border:1px solid var(--border,#262a35);background:var(--surface,#1b1e27);color:var(--text,#e8ecf4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.cs-back:active{transform:scale(.9)}
.cs-back svg{width:18px;height:18px}
.cs-head h1{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;margin:0;flex:1;letter-spacing:-.02em}
.cs-rbtn{width:38px;height:38px;flex-shrink:0;border-radius:12px;border:1px solid var(--border,#262a35);background:var(--surface,#1b1e27);color:var(--muted,#9aa3b2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cs-rbtn:hover{border-color:var(--cs);color:var(--cs)}
.cs-rbtn:active{transform:scale(.9)}
.cs-rbtn.spinning svg{animation:csSpin .8s linear infinite}
@keyframes csSpin{to{transform:rotate(360deg)}}
.cs-rbtn svg{width:17px;height:17px}
/* top bar */
.cs-topbar{position:sticky;top:0;left:0;right:0;height:3px;z-index:5;overflow:hidden;opacity:0;transition:opacity .2s}
.cs-topbar.on{opacity:1}
.cs-topbar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--cs),var(--csg),transparent);animation:csSlide 1s linear infinite}
@keyframes csSlide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
/* search box */
.cs-searchwrap{position:relative;margin:8px 0 12px}
.cs-searchwrap .cs-sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted,#9aa3b2);pointer-events:none}
.cs-search{width:100%;box-sizing:border-box;padding:14px 44px 14px 42px;border-radius:14px;border:1px solid var(--border,#262a35);background:var(--surface,#1b1e27);color:var(--text,#e8ecf4);font:inherit;font-size:.92rem;outline:none;transition:border-color .15s,box-shadow .15s}
.cs-search:focus{border-color:var(--cs);box-shadow:0 0 0 3px color-mix(in srgb,var(--cs) 14%,transparent)}
.cs-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:8px;background:var(--border,#262a35);color:var(--text,#e8ecf4);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.75rem}
.cs-clear.show{display:flex}
/* mode toggle */
.cs-modes{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface,#1b1e27);border:1px solid var(--border,#262a35);margin-bottom:14px}
.cs-mode{flex:1;border:0;background:transparent;color:var(--muted,#9aa3b2);font:inherit;font-size:.72rem;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}
.cs-mode svg{width:13px;height:13px}
.cs-mode.on{color:#06080f;background:linear-gradient(135deg,var(--cs),#3b82f6);box-shadow:0 3px 12px -4px color-mix(in srgb,var(--cs) 60%,transparent)}
/* stats */
.cs-stats{font-size:.7rem;color:var(--muted,#9aa3b2);font-weight:600;margin:0 2px 14px;min-height:1.2em}
.cs-stats b{color:var(--text,#e8ecf4);font-family:'Space Grotesk',monospace}
/* ═══ CARD FEED ═══ */
.cs-feed{display:flex;flex-direction:column;gap:10px}
.cs-card{background:var(--card,#14161d);border:1px solid var(--border,#262a35);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;
  transition:border-color .15s,transform .14s,box-shadow .15s;animation:csCardIn .35s ease both}
.cs-card:hover{border-color:color-mix(in srgb,var(--cs) 40%,var(--border,#262a35));transform:translateX(2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.4)}
.cs-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cs);border-radius:0 4px 4px 0;opacity:.7}
.cs-card.first::before{background:linear-gradient(180deg,var(--csgold),var(--csg));opacity:1}
@keyframes csCardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* card head */
.cs-card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cs-app-chip{font-size:.68rem;font-weight:800;letter-spacing:.03em;color:var(--cs);background:color-mix(in srgb,var(--cs) 12%,transparent);border:1px solid color-mix(in srgb,var(--cs) 22%,transparent);border-radius:8px;padding:3px 10px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-new-tag{font-size:.52rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#06080f;background:linear-gradient(135deg,var(--csgold),var(--csg));border-radius:20px;padding:2px 8px}
.cs-fi-time{margin-left:auto;font-family:'Space Grotesk',monospace;font-size:.62rem;font-weight:700;color:var(--muted,#9aa3b2);white-space:nowrap}
/* card meta */
.cs-card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:9px}
.cs-flag{font-size:1rem;line-height:1}
.cs-range{font-size:.78rem;font-weight:700;color:var(--text,#e8ecf4)}
.cs-num{font-family:'Space Grotesk',monospace;font-size:.72rem;font-weight:700;color:var(--csgold);letter-spacing:.02em;background:color-mix(in srgb,var(--csgold) 10%,transparent);border-radius:6px;padding:2px 8px}
/* message bubble */
.cs-msg-bubble{font-size:.78rem;line-height:1.55;color:var(--muted,#9aa3b2);word-break:break-word;background:var(--surface,#1b1e27);border:1px solid var(--border,#262a35);border-radius:11px;padding:10px 13px}
/* summary chips */
.cs-sum{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:14px}
.cs-sum-lbl{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#9aa3b2)}
.cs-sum-chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;color:var(--text,#e8ecf4);background:var(--surface,#1b1e27);border:1px solid var(--border,#262a35);border-radius:20px;padding:4px 11px}
.cs-sum-chip b{color:var(--cs);font-family:'Space Grotesk',monospace}
/* skeleton */
.cs-sk-card{background:var(--card,#14161d);border:1px solid var(--border,#262a35);border-radius:16px;padding:16px;margin-bottom:10px}
.cs-sk{height:11px;border-radius:7px;background:linear-gradient(90deg,var(--surface,#1b1e27) 25%,color-mix(in srgb,var(--border,#262a35) 60%,var(--surface,#1b1e27)) 50%,var(--surface,#1b1e27) 75%);background-size:200% 100%;animation:csShim 1.3s infinite}
@keyframes csShim{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* empty / tips */
.cs-empty{text-align:center;padding:36px 20px;color:var(--muted,#9aa3b2);font-size:.84rem;line-height:1.6}
.cs-tips{text-align:left;max-width:320px;margin:14px auto 0;font-size:.76rem;color:var(--muted,#9aa3b2);line-height:1.8}
.cs-tips b{color:var(--text,#e8ecf4)}
.cs-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;justify-content:center}
.cs-chip{border:1px solid var(--border,#262a35);background:var(--surface,#1b1e27);color:var(--text,#e8ecf4);border-radius:20px;padding:7px 13px;font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;transition:all .14s}
.cs-chip:hover{border-color:var(--cs);color:var(--cs)}
.cs-chip:active{transform:scale(.95)}
@media(max-width:400px){.cs-app-chip{max-width:42%}.cs-msg-bubble{font-size:.74rem}}
</style>

<div id="cliSearchPage" style="display:none">
<div class="cs-wrap">
  <div class="cs-head">
    <button class="cs-back" onclick="closeCliSearchPage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h1>CLI Search</h1>
    <button class="cs-rbtn" id="csRefreshBtn" onclick="csRefresh()" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
  </div>
  <div class="cs-topbar" id="csTopBar"><i></i></div>
  <div class="cs-searchwrap">
    <svg class="cs-sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
    <input class="cs-search" id="csInput" type="text" autocomplete="off" placeholder="App, country, keyword or phone number…">
    <button class="cs-clear" id="csClear" onclick="csClearInput()">✕</button>
  </div>
  <div class="cs-modes" id="csModes">
    <button class="cs-mode on" data-mode="auto" onclick="csSetMode('auto')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2 9.4h7.6z"/></svg>Auto</button>
    <button class="cs-mode" data-mode="text" onclick="csSetMode('text')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>App · Country · Msg</button>
    <button class="cs-mode" data-mode="number" onclick="csSetMode('number')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>Number</button>
  </div>
  <div class="cs-stats" id="csStats"></div>
  <div id="csResults"></div>
</div>
</div>
